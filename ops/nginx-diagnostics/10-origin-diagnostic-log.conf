# Safe, low-volume diagnostic format. Query strings, request bodies, cookies,
# authorization headers, and arbitrary request headers are intentionally absent.
log_format origin_diagnostic escape=json
    '{"timestamp":"$time_iso8601",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"cdn_peer_ip":"$realip_remote_addr",'
    '"client_ip":"$remote_addr",'
    '"ar_real_ip":"$http_ar_real_ip",'
    '"request_id":"$request_id",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri"}';
