# Production time policy for the Iran VPS.
#
# Runtime stepping is deliberately absent. chronyd may only slew the running
# clock. A separate boot-only, uptime-guarded unit handles a necessary large
# initial correction before application services are ordered to start.

pool 0.ir.pool.ntp.org iburst maxsources 4
pool ntp.ubuntu.com iburst maxsources 4
server time.cloudflare.com iburst

minsources 2
maxdistance 10.0
maxupdateskew 100.0
maxslewrate 1000

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
rtcsync
leapsectz right/UTC

log tracking measurements statistics
logdir /var/log/chrony
logchange 0.1

keyfile /etc/chrony/chrony.keys
bindcmdaddress /run/chrony/chronyd.sock
