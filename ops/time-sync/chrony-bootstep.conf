# Used only by chrony-bootstep-guard.service during the first five minutes of
# boot. It is never used by the long-running chrony.service.
pool 0.ir.pool.ntp.org iburst maxsources 4
pool ntp.ubuntu.com iburst maxsources 4
server time.cloudflare.com iburst
minsources 2
maxdistance 10.0
makestep 1.0 1
pidfile /run/chrony/chronyd-bootstep.pid
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
